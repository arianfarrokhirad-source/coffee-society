# Coffee Society Workflow Add New Package Module

## Action

Follow the add-new-package-module workflow:
1. Create new package directory under packages/ (e.g., packages/ai/)
2. Add package.json with dependencies and metadata
3. Implement core logic in src/ (e.g., src/index.ts, src/feature.ts)
4. Write corresponding unit tests in tests/ (e.g., tests/feature.test.ts)
5. Update monorepo package management files if needed (e.g., package-lock.json)

## Evidence

- Workflow detected from commit patterns
- Frequency: ~4x per month
- Files: jarvis-core/packages/*/package.json, jarvis-core/packages/*/src/*.ts, jarvis-core/packages/*/tests/*.test.ts

